<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishu | Instagram</title>
  <meta name="description" content="Visit the Instagram profile of @__ishu.exe">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Inter, system-ui, Arial, sans-serif;
      color: #fff; background: radial-gradient(ellipse at 20% 10%, #48205d 0, transparent 42%),
      radial-gradient(ellipse at 90% 85%, #263d75 0, transparent 40%), #0c0b12;
    }
    .card {
      width: min(100%, 420px); padding: 38px 28px; text-align: center;
      border: 1px solid rgba(255,255,255,.15); border-radius: 28px;
      background: rgba(255,255,255,.065); box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
    }
    .logo {
      width: 88px; height: 88px; display: grid; place-items: center; margin: 0 auto 22px;
      border-radius: 27px; font-size: 48px; line-height: 1;
      background: radial-gradient(circle at 30% 100%, #ffd776 0 12%, #f56040 35%, #c13584 62%, #833ab4 80%, #405de6 100%);
      box-shadow: 0 10px 35px rgba(193,53,132,.25);
    }
    .eyebrow { color: #c9b8d8; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(27px, 7vw, 34px); letter-spacing: -.04em; }
    p { color: #c8c3d2; margin: 0 auto 25px; line-height: 1.6; }
    .button {
      display: flex; justify-content: center; align-items: center; gap: 10px;
      width: 100%; min-height: 52px; padding: 14px 20px; border-radius: 14px;
      color: #fff; text-decoration: none; font-weight: 700;
      background: linear-gradient(100deg, #d62976, #962fbf 55%, #4f5bd5);
      transition: transform .18s ease, filter .18s ease;
    }
    .button:hover { transform: translateY(-2px); filter: brightness(1.12); }
    .button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .handle { margin-top: 18px; color: #aaa3b8; font-size: 14px; }
    .note { margin-top: 25px; color: #817a90; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">◎</div>
    <div class="eyebrow">Connect on Instagram</div>
    <h1>Find me on Instagram</h1>
    <p>Tap the button below to open the profile.</p>
    <a class="button" href="https://www.instagram.com/__ishu.exe/" target="_blank" rel="noopener noreferrer">
      <span aria-hidden="true">📸</span> Open Instagram Profile <span aria-hidden="true">↗</span>
    </a>
    <div class="handle">@__ishu.exe</div>
    <div class="note">Personal profile link</div>
  </main>
</body>
</html>
